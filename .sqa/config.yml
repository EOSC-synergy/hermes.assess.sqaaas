config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/swiss-seismological-service/hermes:
      branch: v0.2
      repo: https://github.com/swiss-seismological-service/hermes
      subfolder: DTC72/WF7202/ST720202/src
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/swiss-seismological-service/hermes git:
        commands:
        - /usr/bin/env sh .sqa/script.wheezy-smalt-fox.sh
        container: qc.acc_muzzy-vermilion-whippet
  QC.Doc:
    repos:
      github.com/swiss-seismological-service/hermes find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-thistle-kangaroo.sh
        container: qc.doc_clammy-russet-corgi
      github.com/swiss-seismological-service/hermes git:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-rose-ant.sh
        container: qc.doc_breezy-auburn-axolotl
      github.com/swiss-seismological-service/hermes markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-periwinkle-tiger.sh
        container: qc.doc_wimpy-cyan-lionfish
  QC.Lic:
    repos:
      github.com/swiss-seismological-service/hermes licensee:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-goldenrod-chimpanzee.sh
        container: qc.lic_muzzy-champagne-husky
  QC.Sec:
    repos:
      github.com/swiss-seismological-service/hermes bandit:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-burgundy-dormouse.sh
        container: qc.sec_smelly-denim-falcon
  QC.Sty:
    repos:
      github.com/swiss-seismological-service/hermes flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-lavender-sloth.sh
        container: qc.sty_grumpy-green-baboon
      github.com/swiss-seismological-service/hermes hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-ecru-spaniel.sh
        container: qc.sty_blurry-brown-dollar
      github.com/swiss-seismological-service/hermes jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.bumpy-thistle-hedgehog.sh
        container: qc.sty_geeky-seashell-cassowary
  QC.Uni:
    repos:
      github.com/swiss-seismological-service/hermes commands:
        commands:
        - /usr/bin/env sh .sqa/script.grumpy-lemon-fish.sh
        container: qc.uni_clammy-chartreuse-penguin
  QC.Ver:
    repos:
      github.com/swiss-seismological-service/hermes get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.messy-xanthic-mayfly.sh
        container: qc.ver_dorky-white-ferret
timeout: 5400
